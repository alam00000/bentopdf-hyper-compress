<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyper Compress — BentoPDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #111827;
    --surface: #1f2937;
    --hover: #253044;
    --border: #374151;
    --border-strong: #4b5563;
    --text: #f9fafb;
    --muted: #9ca3af;
    --brand: #6366f1;
    --brand-btn: #4f46e5;
    --brand-btn-hover: #4338ca;
    --good: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg); color: #d1d5db;
    font: 14px/1.5 "DM Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  .tool-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand svg { width: 28px; height: 28px; flex: none; }
  .brand .bname { color: #fff; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .brand .tname { color: var(--muted); font-weight: 500; font-size: 15px; white-space: nowrap; }
  .brand .tname::before { content: "/"; margin: 0 8px 0 2px; opacity: .5; }
  .tool-header-actions { margin-left: auto; display: flex; gap: 8px; }
  button {
    font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; transition: background .12s, border-color .12s;
  }
  .btn { padding: 8px 16px; background: var(--brand-btn); color: #fff; }
  .btn:hover { background: var(--brand-btn-hover); }
  .btn-ghost { padding: 8px 16px; background: transparent; border-color: var(--border); color: var(--text); }
  .btn-ghost:hover { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }

  .tool-body {
    flex: 1 1 auto; display: grid;
    grid-template-columns: 1fr 360px;
    min-height: 0;
  }
  .tool-left {
    display: flex; flex-direction: column; min-height: 0;
    padding: 16px 16px 16px 24px;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .tool-right {
    display: flex; flex-direction: column; gap: 16px;
    padding: 20px 24px; overflow-y: auto;
  }

  .tool-dropzone {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    border-radius: 14px; border: 2px dashed var(--border-strong);
    background: var(--surface); min-height: 220px; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .tool-dropzone:hover, .tool-dropzone.over { border-color: var(--brand); background: rgba(99, 102, 241, 0.06); }
  .tool-dropzone-inner { text-align: center; padding: 24px; }
  .tool-dropzone-inner strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
  .tool-dropzone-inner span { color: var(--muted); font-size: 13px; }

  .tool-file-list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    margin: 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 8px;
  }
  .tool-file-row {
    display: grid; grid-template-columns: 24px 1fr auto;
    align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border);
  }
  .tool-file-row:hover { background: var(--hover); }
  .tool-file-num {
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(99, 102, 241, 0.15); font-size: 11px; font-weight: 600; color: var(--text);
  }
  .tool-file-meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .tool-file-name {
    font-size: 13px; font-weight: 500; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tool-file-sub { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .tool-file-sub .dot { opacity: .5; }
  .lock-badge { color: var(--warn); font-weight: 600; }
  .lock-badge.unlocked { color: var(--good); }
  .tool-file-status { margin-top: 2px; font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .tool-file-status .ok { color: var(--good); }
  .tool-file-status .err { color: var(--bad); }
  .tool-file-status .busy { color: var(--muted); }
  .tool-file-pw { margin-top: 4px; }
  .tool-file-pw input {
    font: inherit; font-size: 12px; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    width: 180px; max-width: 100%; outline: none;
  }
  .tool-file-pw input:focus { border-color: var(--brand); }
  .tool-file-pw { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tool-file-pw .btn-ghost { padding: 5px 11px; font-size: 12px; }
  .pw-err { color: var(--bad); font-size: 11px; }
  .tool-file-actions { display: flex; align-items: center; gap: 6px; }
  .tool-file-actions .btn-ghost { padding: 5px 12px; font-size: 12.5px; }
  .icon-x {
    background: none; border: none; color: var(--muted);
    font-size: 14px; padding: 4px 7px; line-height: 1;
  }
  .icon-x:hover { color: var(--bad); }
  .addstrip {
    flex: none; margin-top: 10px; text-align: center;
    border: 1.5px dashed var(--border); border-radius: 10px;
    padding: 9px; color: var(--muted); font-size: 12.5px; cursor: pointer;
    transition: border-color .12s, color .12s;
  }
  .addstrip:hover, .addstrip.over { border-color: var(--brand); color: var(--text); }

  .tool-field-group { display: flex; flex-direction: column; gap: 6px; }
  .tool-field-label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .tool-field-divider { border: none; border-top: 1px solid var(--border); margin: 2px 0; }
  select, input[type=number] {
    font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    width: 100%; outline: none;
  }
  select:focus, input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
  .switch { display: flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    width: 36px; height: 20px; border-radius: 10px; flex: none; position: relative;
    background: var(--border); transition: background .15s;
  }
  .switch .thumb {
    position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--brand); }
  .switch input:checked + .track .thumb { transform: translateX(16px); }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.35); }
  .switch span { font-size: 13.5px; color: var(--text); }
  .switch.off span { color: var(--muted); }

  #options .optgroup { border-bottom: 1px solid var(--border); }
  #options .optgroup:last-child { border-bottom: none; }
  #options .optgroup > summary {
    cursor: pointer; padding: 10px 2px; font-weight: 600; font-size: 12.5px;
    list-style: none; display: flex; align-items: center; gap: 7px; color: var(--text);
  }
  #options .optgroup > summary::-webkit-details-marker { display: none; }
  #options .optgroup > summary::before {
    content: ''; width: 5px; height: 5px; flex: none;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: rotate(-45deg); transition: transform .15s; margin-left: 3px;
  }
  #options .optgroup[open] > summary::before { transform: rotate(45deg); }
  #options .optbody { padding: 2px 2px 12px 15px; display: flex; flex-direction: column; gap: 10px; }
  #options .optrow { display: flex; flex-direction: column; gap: 5px; }
  #options .optrow.check { flex-direction: row; align-items: center; gap: 9px; flex-wrap: wrap; }
  #options .optrow.check label { font-size: 13.5px; color: var(--text); font-weight: 400; }
  #options .optrow label { font-size: 12px; color: var(--muted); font-weight: 500; }
  #options input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--brand); margin: 0; }
  #options .rangeline { display: flex; align-items: center; gap: 11px; }
  #options .rangeline input[type=range] { flex: 1; accent-color: var(--brand); }
  #options .rangeval { font-variant-numeric: tabular-nums; font-size: 12.5px; min-width: 26px; color: var(--muted); }
  #options .opthelp { margin: 0; font-size: 11.5px; color: var(--muted); flex-basis: 100%; padding-left: 24px; }
  #options .optrow:not(.check) .opthelp { padding-left: 0; }
  .opt-head { display: flex; justify-content: space-between; align-items: center; }
  .opt-head .tool-field-label { text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
  .opt-head button { padding: 4px 11px; font-size: 12px; }

  .tool-apply { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .tool-apply .btn { width: 100%; padding: 11px 16px; font-size: 15px; }
  #status { font-size: 12.5px; color: var(--muted); min-height: 18px; text-align: center; }
  #status.err { color: var(--bad); }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tbody tr:last-child td { border-bottom: none; }
  .saved { color: var(--good); font-weight: 600; }
  .saved.none { color: var(--muted); font-weight: 400; }
  .err { color: var(--bad); }
  #resultPanel { flex: none; margin-top: 12px; max-height: 40%; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
  .hidden { display: none; }

  @media (max-width: 760px) {
    .tool-body { grid-template-columns: 1fr; overflow-y: auto; display: flex; flex-direction: column; }
    .tool-left { border-right: none; border-bottom: 1px solid var(--border); padding: 14px 16px; overflow: visible; }
    .tool-file-list { overflow: visible; }
    .tool-right { padding: 16px; overflow: visible; }
    .tool-header { padding: 12px 16px; flex-wrap: wrap; }
    .tool-header-actions { margin-left: auto; }
    .tool-header-actions .btn-ghost, .tool-header-actions .btn { padding: 7px 12px; font-size: 13px; }
    .tool-dropzone { min-height: 160px; }
    .tool-apply { margin-top: 4px; }
    body { height: auto; min-height: 100%; }
  }
</style>
</head>
<body>
<header class="tool-header">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 166 166" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g transform="translate(40, 0)">
    <path d="M56.7848 80.9116L0 25.6211L24.8434 1.43151C26.8037 -0.47717 29.9814 -0.47717 31.9414 1.43151L85.177 53.2662L56.7848 80.9116Z" fill="#A5B4FC"/>
    <path d="M-1.30805e-05 80.7335L21.2939 101.467L42.5878 80.7335L21.2939 60L-1.30805e-05 80.7335Z" fill="#E0E7FF"/>
    <path d="M56.7848 83L81.6279 107.19C83.5881 109.098 83.5881 112.192 81.6279 114.101L28.3925 165.936L0 138.29L56.7848 83Z" fill="#6366F1"/>
    </g>
    </svg>
    <span class="bname">BentoPDF</span>
    <span class="tname">Hyper Compress</span>
  </div>
  <div class="tool-header-actions">
    <button class="btn-ghost" id="addBtn" type="button">Add files</button>
    <button class="btn-ghost" id="clearBtn" type="button" disabled>Clear</button>
  </div>
</header>

<div class="tool-body">
  <section class="tool-left">
    <div class="tool-dropzone" id="drop" role="button" tabindex="0" aria-label="Choose PDFs">
      <div class="tool-dropzone-inner">
        <strong>Drop PDFs here</strong>
        <span>or click to choose files</span>
      </div>
      <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    </div>
    <ul class="tool-file-list hidden" id="fileList"></ul>
    <div class="addstrip hidden" id="addStrip">Drop more PDFs or click to add</div>
    <div class="hidden" id="resultPanel">
      <table>
        <thead>
          <tr><th>File - preset</th><th>Original</th><th>Result</th><th>Saved</th><th>Time</th><th></th></tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </section>

  <aside class="tool-right">
    <div class="tool-field-group">
      <span class="tool-field-label">Compression level</span>
      <select id="preset">
        <option value="low">Low - quality 80, 200 dpi</option>
        <option value="medium" selected>Medium - quality 50, 150 dpi</option>
        <option value="high">High - quality 20, 72 dpi</option>
        <option value="lossless">Lossless - no re-encoding</option>
        <option value="__custom">Custom</option>
        <option value="__all">Compare all four presets</option>
      </select>
    </div>

    <div class="tool-field-group">
      <span class="tool-field-label">Target size (MB)</span>
      <input id="targetSize" type="number" min="0" step="0.1" placeholder="none">
    </div>

    <label class="switch off" id="brotliSwitch" title="PDF 2.0 /BrotliDecode: smaller files; needs a Brotli-capable reader (MuPDF, Ghostscript, Firefox). Off while preserving PDF/A.">
      <input type="checkbox" id="brotli">
      <span class="track"><span class="thumb"></span></span>
      <span>Brotli (PDF 2.0)</span>
    </label>
    <label class="switch off" id="pdfaSwitch">
      <input type="checkbox" id="preserveConformance">
      <span class="track"><span class="thumb"></span></span>
      <span>Preserve PDF/A</span>
    </label>

    <hr class="tool-field-divider">

    <div class="opt-head">
      <span class="tool-field-label">Advanced options</span>
      <button class="btn-ghost" id="reset" type="button">Reset</button>
    </div>
    <div id="options"></div>

    <div class="tool-apply">
      <button class="btn" id="run" disabled>Compress</button>
      <div id="status"></div>
    </div>
  </aside>
</div>

<script type="module">
import { HYPER_PRESETS } from '/dist/sdk/node/presets.js';
import { normalizeHyperOptions } from '/dist/sdk/node/options.js';
import { renderOptions, sameOptions } from '/web/options-ui.js';

const $ = (id) => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), runBtn = $('run');
const statusEl = $('status'), resultsEl = $('results'), resultPanel = $('resultPanel');
const presetSel = $('preset');
const brotliInput = $('brotli'), pdfaInput = $('preserveConformance');
const fileListEl = $('fileList'), addStrip = $('addStrip');

let files = [];
let running = false;
let uid = 0;

const fmtBytes = (n) => {
  if (n < 1000) return `${n} B`;
  if (n < 1000 * 1000) return `${(n / 1000).toFixed(1)} KB`;
  return `${(n / 1000 / 1000).toFixed(2)} MB`;
};

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.className = isError ? 'err' : '';
}

function cell(row, text, className) {
  const td = document.createElement('td');
  td.textContent = text;
  if (className) td.className = className;
  row.appendChild(td);
  return td;
}

function hasEncrypt(bytes) {
  const view = new Uint8Array(bytes);
  const pat = [0x2f, 0x45, 0x6e, 0x63, 0x72, 0x79, 0x70, 0x74];
  outer: for (let i = 0; i <= view.length - pat.length; i++) {
    for (let j = 0; j < pat.length; j++) {
      if (view[i + j] !== pat[j]) continue outer;
    }
    return true;
  }
  return false;
}

function countPages(bytes) {
  if (bytes.byteLength > 64 * 1024 * 1024) return null;
  const s = new TextDecoder('latin1').decode(bytes);
  const m = s.match(/\/Type\s*\/Page(?![a-zA-Z])/g);
  return m ? m.length : null;
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(data) {
  let c = 0xffffffff;
  for (let i = 0; i < data.length; i++) c = CRC_TABLE[(c ^ data[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function makeZip(entries) {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  for (const e of entries) {
    const nameB = enc.encode(e.name);
    const crc = crc32(e.data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, e.data.length, true);
    local.setUint32(22, e.data.length, true);
    local.setUint16(26, nameB.length, true);
    parts.push(new Uint8Array(local.buffer), nameB, e.data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, e.data.length, true);
    cd.setUint32(24, e.data.length, true);
    cd.setUint16(28, nameB.length, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), nameB);
    offset += 30 + nameB.length + e.data.length;
  }
  let cdLen = 0;
  for (const c of central) cdLen += c.length;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, entries.length, true);
  end.setUint16(10, entries.length, true);
  end.setUint32(12, cdLen, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

function refreshChrome() {
  const has = files.length > 0;
  fileListEl.classList.toggle('hidden', !has);
  addStrip.classList.toggle('hidden', !has);
  drop.classList.toggle('hidden', has);
  $('clearBtn').disabled = !has || running;
  refreshRunState();
}

function statusNode(f) {
  const div = document.createElement('div');
  div.className = 'tool-file-status';
  const span = document.createElement('span');
  if (f.status === 'compressing') {
    span.className = 'busy';
    span.textContent = 'Compressing...';
  } else if (f.status === 'failed') {
    span.className = 'err';
    span.textContent = f.error || 'failed';
  } else if (f.status === 'done' && f.result) {
    span.className = 'ok';
    const pct = 100 * (1 - f.result.compressedSize / f.result.originalSize);
    span.textContent = f.result.compressedSize >= f.result.originalSize
      ? 'No gain, original kept'
      : `${fmtBytes(f.result.compressedSize)} (${pct >= 0.05 ? '-' + pct.toFixed(1) + '%' : 'same'})`;
  } else {
    return null;
  }
  div.appendChild(span);
  return div;
}

function renderFileRows() {
  fileListEl.replaceChildren();
  files.forEach((f, i) => {
    const li = document.createElement('li');
    li.className = 'tool-file-row';

    const num = document.createElement('span');
    num.className = 'tool-file-num';
    num.textContent = String(i + 1);

    const meta = document.createElement('div');
    meta.className = 'tool-file-meta';
    const name = document.createElement('div');
    name.className = 'tool-file-name';
    name.textContent = f.name.replace(/\.pdf$/i, '');
    name.title = f.name;
    const sub = document.createElement('div');
    sub.className = 'tool-file-sub';
    const bits = [];
    if (f.pages) bits.push(`${f.pages} page${f.pages === 1 ? '' : 's'}`);
    bits.push(fmtBytes(f.bytes.byteLength));
    sub.append(bits.join(' '));
    const dots = document.createElement('span');
    dots.className = 'dot';
    dots.textContent = ' · ';
    if (f.encrypted) {
      sub.append(dots.cloneNode(true));
      const lock = document.createElement('span');
      lock.className = 'lock-badge' + (f.verified ? ' unlocked' : '');
      lock.textContent = f.verified ? 'Unlocked' : 'Locked';
      if (f.verified) {
        lock.style.cursor = 'pointer';
        lock.title = 'Change password';
        lock.addEventListener('click', () => { f.verified = false; renderFileRows(); });
      }
      sub.append(lock);
    }
    meta.append(name, sub);
    const st = statusNode(f);
    if (st) meta.append(st);
    if (f.encrypted && !running && !f.verified) {
      const pwWrap = document.createElement('div');
      pwWrap.className = 'tool-file-pw';
      const pw = document.createElement('input');
      pw.type = 'password';
      pw.placeholder = 'password';
      pw.autocomplete = 'off';
      pw.value = f.password || '';
      pw.addEventListener('input', () => { f.password = pw.value; });
      const unlock = document.createElement('button');
      unlock.className = 'btn-ghost';
      unlock.type = 'button';
      unlock.textContent = 'Unlock';
      const doUnlock = async () => {
        f.password = pw.value;
        if (!f.password) return;
        unlock.disabled = true;
        unlock.textContent = 'Checking...';
        const ok = await verifyPassword(f);
        f.verified = ok;
        f.pwError = ok ? '' : 'Wrong password';
        renderFileRows();
      };
      unlock.addEventListener('click', doUnlock);
      pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') doUnlock(); });
      pwWrap.append(pw, unlock);
      if (f.pwError) {
        const err = document.createElement('span');
        err.className = 'pw-err';
        err.textContent = f.pwError;
        pwWrap.append(err);
      }
      meta.append(pwWrap);
    }

    const actions = document.createElement('div');
    actions.className = 'tool-file-actions';
    if (f.status === 'done' && f.result && f.result.data) {
      const save = document.createElement('button');
      save.className = 'btn-ghost';
      save.type = 'button';
      save.textContent = 'Save';
      save.addEventListener('click', () => {
        downloadBlob(new Blob([f.result.data], { type: 'application/pdf' }),
          f.name.replace(/\.pdf$/i, '') + `-${f.result.preset}.pdf`);
      });
      actions.append(save);
    }
    const rm = document.createElement('button');
    rm.className = 'icon-x';
    rm.type = 'button';
    rm.textContent = '✕';
    rm.title = 'Remove';
    rm.disabled = running;
    rm.addEventListener('click', () => {
      files.splice(i, 1);
      renderFileRows();
      refreshChrome();
    });
    actions.append(rm);

    li.append(num, meta, actions);
    fileListEl.append(li);
  });
}

async function accept(fileList) {
  const picked = [...fileList].filter((f) => f && (/\.pdf$/i.test(f.name) || f.type === 'application/pdf'));
  if (!picked.length) return;
  for (const f of picked) {
    if (files.some((x) => x.name === f.name && x.bytes.byteLength === f.size)) continue;
    const bytes = await f.arrayBuffer();
    files.push({
      uid: ++uid,
      name: f.name,
      bytes,
      encrypted: hasEncrypt(bytes),
      pages: countPages(bytes),
      password: '',
      status: 'idle',
    });
  }
  renderFileRows();
  refreshChrome();
}

for (const el of [drop, addStrip]) {
  el.addEventListener('click', () => fileInput.click());
  ['dragenter', 'dragover'].forEach((ev) =>
    el.addEventListener(ev, (e) => { e.preventDefault(); el.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) =>
    el.addEventListener(ev, () => el.classList.remove('over')));
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    accept(e.dataTransfer.files);
  });
}
drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
fileInput.addEventListener('change', () => { accept(fileInput.files); fileInput.value = ''; });
$('addBtn').addEventListener('click', () => fileInput.click());
$('clearBtn').addEventListener('click', () => {
  files = [];
  resultsEl.replaceChildren();
  resultPanel.classList.add('hidden');
  renderFileRows();
  refreshChrome();
});

let options = normalizeHyperOptions(HYPER_PRESETS.medium);

function matchingPreset(opts) {
  return Object.keys(HYPER_PRESETS).find((name) =>
    sameOptions(normalizeHyperOptions(HYPER_PRESETS[name]), opts));
}

const setControls = renderOptions($('options'), options, (next) => {
  options = normalizeHyperOptions(next);
  const match = matchingPreset(options);
  presetSel.value = match ?? '__custom';
});

function applyPreset(name) {
  options = normalizeHyperOptions({
    ...HYPER_PRESETS[name],
    preserveConformance: options.preserveConformance,
    brotli: options.brotli,
  });
  setControls(options);
}

pdfaInput.addEventListener('change', () => {
  options = { ...options, preserveConformance: pdfaInput.checked };
  $('pdfaSwitch').classList.toggle('off', !pdfaInput.checked);
});

brotliInput.addEventListener('change', () => {
  options = { ...options, brotli: brotliInput.checked };
  $('brotliSwitch').classList.toggle('off', !brotliInput.checked);
});

presetSel.addEventListener('change', () => {
  const v = presetSel.value;
  if (v === '__custom' || v === '__all') return;
  applyPreset(v);
});

$('reset').addEventListener('click', () => {
  const v = presetSel.value;
  applyPreset(v === '__custom' || v === '__all' ? 'medium' : v);
  if (v === '__custom') presetSel.value = 'medium';
});

function renderCompareRows(results, file, multi) {
  for (const r of results) {
    const tr = document.createElement('tr');
    const label = multi ? `${file.name} - ${r.preset}` : r.preset;
    cell(tr, label);
    if (r.error) {
      const td = cell(tr, r.error, 'err');
      td.colSpan = 5;
      resultsEl.appendChild(tr);
      continue;
    }
    cell(tr, fmtBytes(r.originalSize));
    cell(tr, fmtBytes(r.compressedSize));
    const pct = 100 * (1 - r.compressedSize / r.originalSize);
    const unchanged = r.compressedSize >= r.originalSize;
    cell(tr, unchanged ? 'no gain' : `${pct.toFixed(1)}%`, unchanged ? 'saved none' : 'saved');
    cell(tr, `${r.ms} ms`);
    const actions = cell(tr, '');
    if (r.data) {
      const btn = document.createElement('button');
      btn.className = 'btn-ghost';
      btn.textContent = 'Save';
      btn.addEventListener('click', () => {
        downloadBlob(new Blob([r.data], { type: 'application/pdf' }),
          file.name.replace(/\.pdf$/i, '') + `-${r.preset}.pdf`);
      });
      actions.appendChild(btn);
    }
    resultsEl.appendChild(tr);
  }
  resultPanel.classList.remove('hidden');
}

function refreshRunState() {
  runBtn.disabled = !files.length || running;
}

async function verifyPassword(file) {
  const headers = {};
  if (file.password) headers['X-Password'] = file.password;
  try {
    const res = await fetch('/api/verify-password', { method: 'POST', headers, body: file.bytes });
    if (!res.ok) return false;
    return (await res.json()).valid === true;
  } catch {
    return false;
  }
}

async function engineCompress(file, jobs, targetSizeBytes) {
  const results = [];
  for (const job of jobs) {
    const params = new URLSearchParams({
      preset: HYPER_PRESETS[job.label] ? job.label : 'medium',
      options: JSON.stringify(job.options),
    });
    if (targetSizeBytes) params.set('targetSizeBytes', String(targetSizeBytes));
    const headers = {};
    if (file.encrypted && file.password) headers['X-Password'] = file.password;
    const started = performance.now();
    const res = await fetch(`/api/compress?${params}`, {
      method: 'POST', headers, body: file.bytes,
    });
    if (!res.ok) {
      let code = res.statusText;
      try { code = (await res.json()).error; } catch {}
      results.push({ preset: job.label, error: code });
      continue;
    }
    const blob = await res.blob();
    const data = new Uint8Array(await blob.arrayBuffer());
    results.push({
      preset: job.label,
      originalSize: Number(res.headers.get('x-original-size')) || file.bytes.byteLength,
      compressedSize: Number(res.headers.get('x-compressed-size')) || data.length,
      signed: res.headers.get('x-signed') === 'true',
      ms: Math.round(performance.now() - started),
      data,
    });
  }
  return results;
}

runBtn.addEventListener('click', async () => {
  if (!files.length || running) return;
  const choice = presetSel.value;
  const compareAll = choice === '__all';
  const jobs = compareAll
    ? ['low', 'medium', 'high', 'lossless'].map((p) => ({
        label: p,
        options: normalizeHyperOptions({
          ...HYPER_PRESETS[p],
          brotli: brotliInput.checked,
          preserveConformance: pdfaInput.checked,
        }),
      }))
    : [{ label: choice === '__custom' ? 'custom' : choice, options }];

  const targetMb = parseFloat($('targetSize').value);
  const targetSizeBytes = Number.isFinite(targetMb) && targetMb > 0
    ? Math.floor(targetMb * 1024 * 1024)
    : undefined;

  running = true;
  runBtn.disabled = true;
  resultsEl.replaceChildren();
  resultPanel.classList.add('hidden');
  const multi = files.length > 1;
  const zipEntries = [];
  try {
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      f.status = 'compressing';
      f.result = null;
      renderFileRows();
      setStatus(multi ? `Compressing ${i + 1} of ${files.length}` : 'Compressing...');
      let results;
      try {
        results = await engineCompress(f, jobs, targetSizeBytes);
      } catch (e) {
        f.status = 'failed';
        f.error = e.message || String(e);
        renderFileRows();
        continue;
      }
      if (compareAll) {
        f.status = results.some((r) => !r.error) ? 'done' : 'failed';
        if (f.status === 'done') f.result = results.find((r) => !r.error);
        renderCompareRows(results, f, multi);
      } else {
        const r = results[0];
        if (r.error) {
          f.status = 'failed';
          f.error = r.error;
        } else {
          f.status = 'done';
          f.result = r;
        }
      }
      renderFileRows();
      if (multi) {
        for (const r of results) {
          if (r.data) {
            zipEntries.push({
              name: f.name.replace(/\.pdf$/i, '') + `-${r.preset}.pdf`,
              data: r.data,
            });
          }
        }
      }
    }
    if (multi && zipEntries.length) {
      setStatus('Zipping...');
      downloadBlob(makeZip(zipEntries), 'hyper-compressed.zip');
      setStatus('Done. Zip downloaded.');
    } else {
      setStatus('Done.');
    }
  } finally {
    running = false;
    renderFileRows();
    refreshChrome();
  }
});

refreshChrome();
</script>
