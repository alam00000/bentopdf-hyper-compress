name: nightly
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  integration:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: fetch release binaries
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "no release yet, skipping"
            exit 0
          fi
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern 'hyper-compress-*-macos-arm64.tar.gz' --pattern 'SHA256SUMS' -D rel
          cd rel
          grep 'macos-arm64' SHA256SUMS | shasum -a 256 -c -
          tar -xzf hyper-compress-*-macos-arm64.tar.gz -C ../cli/prebuilt
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: tools
        if: steps.fetch.outputs.skip == 'false'
        run: brew install poppler mupdf-tools qpdf
      - name: check
        if: steps.fetch.outputs.skip == 'false'
        run: |
          npm ci
          make check
      - name: regress
        if: steps.fetch.outputs.skip == 'false'
        run: make regress
