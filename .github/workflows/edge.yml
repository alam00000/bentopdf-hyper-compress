name: edge
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA="${GITHUB_SHA::7}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile -t "$IMAGE:edge" -t "$IMAGE:edge-$SHA" .
      - name: verify
        run: |
          docker run -d --name hc -p 8080:8080 "$IMAGE:edge"
          ok=0
          for i in $(seq 1 30); do
            if curl -sf localhost:8080/healthz >/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { docker logs hc; exit 1; }
          curl -sf -o /tmp/out.pdf --data-binary @tests/regression/failset/govdocs001-0142b23c0caa.pdf 'localhost:8080/api/compress?preset=medium'
          head -c 4 /tmp/out.pdf | grep -q '%PDF'
          docker rm -f hc
      - name: push
        run: |
          docker push "$IMAGE:edge"
          docker push "$IMAGE:edge-$SHA"
