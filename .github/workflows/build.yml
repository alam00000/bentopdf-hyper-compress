name: build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
      - name: pdfium checkout
        run: |
          PIN="$(grep '^PDFIUM_PIN=' core/build/apply-tree.sh | cut -d= -f2)"
          mkdir -p core/build/gsrc && cd core/build/gsrc
          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          gclient sync --revision "pdfium@$PIN" -D --no-history
      - name: build engine
        run: |
          core/build/apply-tree.sh
          core/build/build-native.sh
          sdk/native/build-dylib.sh
      - name: verify binaries
        run: |
          ls -la cli/prebuilt/hpdf-worker cli/prebuilt/hpdf-render sdk/native/lib/libhypercompress.dylib
          cli/prebuilt/hpdf-worker tests/regression/failset/govdocs001-0142b23c0caa.pdf /tmp/out.pdf 1=150 2=50
          head -c 4 /tmp/out.pdf | grep -q '%PDF'
          echo "worker compressed a real PDF: $(stat -f%z tests/regression/failset/govdocs001-0142b23c0caa.pdf) -> $(stat -f%z /tmp/out.pdf) bytes"

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config rsync \
            python3 xz-utils lsb-release file libjpeg-dev zlib1g-dev
      - name: depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
      - name: pdfium checkout
        run: |
          PIN="$(grep '^PDFIUM_PIN=' core/build/apply-tree.sh | cut -d= -f2)"
          mkdir -p core/build/gsrc && cd core/build/gsrc
          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          gclient sync --revision "pdfium@$PIN" -D --no-history
      - name: build engine
        run: |
          docker/build-jpegli-linux.sh
          docker/build-linux.sh
      - name: verify binaries
        run: |
          ls -la cli/prebuilt/hpdf-worker cli/prebuilt/hpdf-render
          cli/prebuilt/hpdf-worker tests/regression/failset/govdocs001-0142b23c0caa.pdf /tmp/out.pdf 1=150 2=50
          head -c 4 /tmp/out.pdf | grep -q '%PDF'
          echo "worker compressed a real PDF: $(stat -c%s tests/regression/failset/govdocs001-0142b23c0caa.pdf) -> $(stat -c%s /tmp/out.pdf) bytes"

  windows-x64:
    runs-on: windows-2022
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
    steps:
      - uses: actions/checkout@v7
      - name: install windows sdk 10.0.28000.0
        shell: bash
        run: |
          SDK_DIR="/c/Program Files (x86)/Windows Kits/10/bin/10.0.28000.0"
          if [ ! -d "$SDK_DIR/x64" ]; then
            curl -sL -o "$TEMP/winsdksetup.exe" 'https://go.microsoft.com/fwlink/?linkid=2370315'
            MSYS2_ARG_CONV_EXCL="*" "$TEMP/winsdksetup.exe" \
              /features OptionId.DesktopCPPx64 /ceip off /quiet /norestart
          fi
          echo "$SDK_DIR/x64" >> "$GITHUB_PATH"
      - name: depot_tools
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
      - name: pdfium checkout
        shell: bash
        run: |
          PIN="$(grep '^PDFIUM_PIN=' core/build/apply-tree.sh | cut -d= -f2)"
          mkdir -p core/build/gsrc && cd core/build/gsrc
          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          gclient sync --revision "pdfium@$PIN" -D --no-history
      - name: build pdfium archive
        shell: bash
        run: |
          core/build/apply-sources.sh core/build/gsrc/pdfium
          cd core/build/gsrc/pdfium
          mkdir -p out/win-x64
          cat > out/win-x64/args.gn <<'ARGS'
          is_debug = false
          treat_warnings_as_errors = false
          pdf_use_skia = false
          pdf_enable_xfa = false
          pdf_enable_v8 = false
          pdf_enable_brotli = true
          is_component_build = false
          clang_use_chrome_plugins = false
          pdf_is_standalone = true
          pdf_is_complete_lib = true
          pdf_use_partition_alloc = false
          use_custom_libcxx = false
          symbol_level = 0
          target_os = "win"
          target_cpu = "x64"
          ARGS
          buildtools/win/gn.exe gen out/win-x64 --root=.
          third_party/ninja/ninja.exe -C out/win-x64 pdfium
      - name: link workers
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          SRC=core/build/gsrc/pdfium
          CL="$SRC/third_party/llvm-build/Release+Asserts/bin/clang-cl.exe"
          LINK="$SRC/third_party/llvm-build/Release+Asserts/bin/lld-link.exe"
          JP=core/third_party/jpegli/win-x64
          NM="$SRC/third_party/llvm-build/Release+Asserts/bin/llvm-nm.exe"
          "$NM" "$SRC/out/win-x64/obj/pdfium.lib" 2>/dev/null | grep -c 'T HyperCompress' || echo "no HyperCompress symbols in pdfium.lib"
          mkdir -p sdk/native/include/public core/build/out cli/prebuilt
          cp -R "$SRC/public/." sdk/native/include/public/
          "$CL" /nologo /std:c++17 /O2 /DNDEBUG /EHsc -I"$JP" -I"$JP/include" \
            /c core/src/hyper_jpegli_wrap.cc /Fo:core/build/out/hyper_jpegli_wrap.obj
          for drv in hpdf_worker hpdf_render; do
            "$CL" /nologo /std:c++17 /O2 /EHsc -Isdk/native/include \
              /c "core/driver/$drv.cpp" /Fo:"core/build/out/$drv.obj"
            "$LINK" /nologo /out:"cli/prebuilt/${drv//_/-}.exe" \
              "core/build/out/$drv.obj" core/build/out/hyper_jpegli_wrap.obj \
              /WHOLEARCHIVE:"$SRC/out/win-x64/obj/pdfium.lib" \
              "$JP/jpegli-static.lib" "$JP/hwy.lib" \
              user32.lib gdi32.lib advapi32.lib shell32.lib ole32.lib ws2_32.lib
          done
      - name: verify binaries
        shell: bash
        run: |
          ls -la cli/prebuilt/hpdf-worker.exe cli/prebuilt/hpdf-render.exe
          cli/prebuilt/hpdf-worker.exe tests/regression/failset/govdocs001-0142b23c0caa.pdf out.pdf 1=150 2=50
          head -c 4 out.pdf | grep -q '%PDF'
          echo "worker compressed a real PDF: $(stat -c%s tests/regression/failset/govdocs001-0142b23c0caa.pdf) -> $(stat -c%s out.pdf) bytes"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build -f docker/Dockerfile -t hyper-compress:test .
      - name: verify serve mode
        run: |
          docker run -d --name hc -p 8080:8080 hyper-compress:test
          ok=0
          for i in $(seq 1 30); do
            if curl -sf localhost:8080/healthz >/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { docker logs hc; exit 1; }
          curl -sf localhost:8080/healthz
          curl -sf -o /tmp/out.pdf --data-binary @tests/regression/failset/govdocs001-0142b23c0caa.pdf 'localhost:8080/api/compress?preset=medium'
          head -c 4 /tmp/out.pdf | grep -q '%PDF'
          echo "serve mode compressed a real PDF: $(stat -c%s /tmp/out.pdf) bytes"
      - name: verify cli mode
        run: |
          mkdir -p /tmp/work && chmod 777 /tmp/work
          cp tests/regression/failset/govdocs001-0142b23c0caa.pdf /tmp/work/in.pdf
          docker run --rm -v /tmp/work:/work hyper-compress:test in.pdf out.pdf --preset high
          head -c 4 /tmp/work/out.pdf | grep -q '%PDF'
          echo "cli mode compressed a real PDF: $(stat -c%s /tmp/work/out.pdf) bytes"
