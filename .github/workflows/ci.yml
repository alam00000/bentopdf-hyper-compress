name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: make check
      - name: shell script syntax
        run: |
          for f in cli/compress.sh cli/build-qpdf.sh scripts/*.sh core/build/*.sh sdk/native/*.sh wasm/*.sh docker/*.sh; do
            bash -n "$f"
          done
      - name: binary manifest is current
        run: |
          scripts/manifest.sh
          git diff --exit-code BINARIES.sha256
